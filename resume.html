<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Medhansh Khattar - Resume</title>
  <meta name="robots" content="noindex" />
  <style>
    @page { size: A4; margin: 11mm 12mm 10mm; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9ecf2; color: #1d2433; font: 9.6pt/1.33 "Segoe UI", Calibri, Arial, sans-serif; }
    main { max-width: 210mm; margin: 24px auto; padding: 16mm 15mm; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
    header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; border-bottom: 2.5px solid #1e4fb8; padding-bottom: 8px; }
    h1 { margin: 0; font-size: 23pt; letter-spacing: .3px; color: #0a246a; }
    .role { color: #444; font-size: 11pt; }
    .contact { text-align: right; font-size: 9.5pt; line-height: 1.5; }
    a { color: #1e4fb8; text-decoration: none; }
    h2 { break-after: avoid; margin: 10px 0 4px; font-size: 10.5pt; text-transform: uppercase; letter-spacing: 1.2px; color: #1e4fb8; border-bottom: 1px solid #d5dcec; padding-bottom: 2px; }
    .item { margin-bottom: 5px; break-inside: avoid; }
    .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .row b { font-size: 10.5pt; }
    .muted { color: #5b6476; font-size: 9.5pt; }
    ul { margin: 2px 0 0; padding-left: 16px; }
    li { margin: 1px 0; }
    p { margin: 2px 0; }
    .skills div { margin: 1px 0; }
    .two { columns: 2; column-gap: 22px; }
    .two li { break-inside: avoid; }
    @media print { body { background: #fff; } main { margin: 0; padding: 0; max-width: none; box-shadow: none; } a { color: #1e4fb8; } }
    @media (max-width: 640px) { main { margin: 0; padding: 18px 16px; } header { flex-direction: column; align-items: flex-start; } .contact { text-align: left; } .two { columns: 1; } }
  </style>
</head>
<body>
  <main id="r"></main>
  <script src="data.js?v=14"></script>
  <script>
    (() => {
      const P = window.PROFILE || {}, L = P.links || {};
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const link = (u) => u ? `<a href="${esc(u)}">${esc(u.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, ""))}</a>` : "";
      const list = (a) => a?.length ? `<ul>${a.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
      const sec = (t, body) => body ? `<h2>${t}</h2>${body}` : "";
      document.title = `${P.name} - Resume`;
      document.getElementById("r").innerHTML = `
        <header><div><h1>${esc(P.name)}</h1><div class="role">${esc(P.role)}${P.subtitle ? " · " + esc(P.subtitle) : ""}</div><div class="muted">${esc(P.location)}</div></div>
          <div class="contact">${L.email ? `<a href="mailto:${esc(L.email)}">${esc(L.email)}</a><br>` : ""}${[L.linkedin, L.github, L.website, L.yapless].filter(Boolean).map(link).join("<br>")}<br><a href="https://medhansh-xp.vercel.app/">medhansh-xp.vercel.app</a></div></header>
        ${sec("Summary", `<p>${esc(P.summary || (P.bio || []).join(" "))}</p>`)}
        ${sec("Experience", (P.experience || []).map((x) => `<div class="item"><div class="row"><b>${esc(x.title)} - ${esc(x.org)}</b><span class="muted">${esc(x.years)}</span></div>${x.location ? `<div class="muted">${esc(x.location)}</div>` : ""}${list(x.points)}</div>`).join(""))}
        ${sec("Projects", (P.projects || []).filter((p) => p.resume !== false).map((p) => `<div class="item"><div class="row"><b>${esc(p.name)}</b><span class="muted">${esc((p.stack || []).join(" · "))}</span></div><p>${esc(p.desc)}</p>${[p.github, p.url].filter(Boolean).length ? `<div class="muted">${[p.github, p.url].filter(Boolean).map(link).join(" &nbsp;|&nbsp; ")}</div>` : ""}</div>`).join(""))}
        ${sec("Education", (P.education || []).map((e) => `<div class="item"><div class="row"><b>${esc(e.school)}</b><span class="muted">${esc(e.years)}</span></div><div>${esc(e.degree)}${e.detail ? ` <span class="muted">· ${esc(e.detail)}</span>` : ""}</div>${list(e.points)}</div>`).join(""))}
        ${sec("Skills", Object.keys(P.skills || {}).length ? `<div class="skills">${Object.entries(P.skills).map(([k, v]) => `<div><b>${esc(k)}:</b> ${(v || []).map(esc).join(", ")}</div>`).join("")}</div>` : "")}
        ${sec("Honors & Awards", P.achievements?.length ? `<ul class="two">${P.achievements.map((a) => `<li>${esc(a)}</li>`).join("")}</ul>` : "")}
        ${sec("Certifications", list(P.certifications))}
        ${sec("Languages", P.languages?.length ? `<p>${P.languages.map(esc).join(" · ")}</p>` : "")}`;
    })();
  </script>
</body>
</html>
